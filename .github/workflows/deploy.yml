name: Deploy to GitHub Pages

# Build on every push to main, and allow manual runs from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant the token the permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Serve under https://<user>.github.io/<repo>/ — derived from the repo
          # name so this works on forks/renames with no edits.
          BASE_PATH: /${{ github.event.repository.name }}/

      # The scans are personal-use art and gitignored, so the public site is the
      # CSS-rendered version: no public/img → the app falls back automatically.
      - uses: actions/configure-pages@v5
        with:
          # first run: switch the repo's Pages source to "GitHub Actions"
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
